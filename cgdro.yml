site_name: CGDRO Documentation
site_description: Comprehensive documentation for CGDRO Python and R packages.
copyright: "Copyright © 2025"

use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    #- navigation.instant
    - navigation.sections
    - navigation.tabs           # <— add
    - navigation.tabs.sticky    # <— keeps tabs in header while scrolling
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: "#80AF7E"
      accent:  "#B4D269"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: "#9CCF9C"
      accent:  "#EBCB64"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode



plugins:
  - search:
      lang: [en, zh]
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
  - mkdocs-jupyter:
      execute: false

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - attr_list   

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css       

extra:
  #version:
   # provider: mike
  social:                         # stays for footer icons
    - icon: fontawesome/brands/github
      link: https://github.com/jaon11/CGDRO-Py
      name: CGDRO Python repo
    - icon: fontawesome/brands/github
      link: https://github.com/jaon11/CGDRO
      name: CGDRO R repo

nav:
  - Home: index.md
  - Introduction:
      - Overview: setup/intro.md
      - Linear Regression (lowdim): setup/reg_ld.md
      - Linear Regression (highdim): setup/reg_hd.md
      - Regression (machine learning): setup/reg_ml.md
      - Classification: setup/cls.md
  - Python Package:
      - Getting Started: python/index.md
      - API Reference: python/ref.md
      - Tutorials:
          - Linear Regression (lowdim): python/reg_ld.ipynb
          - Linear Regression (highdim): python/reg_hd.ipynb
          - Regression (machine learning): python/reg_ml.ipynb
          - Classification: python/cls.ipynb
  - R Package:
      - Getting Started: R/index.md
      - API Reference: R/ref.md
      - Tutorials:
          - Linear Regression (lowdim): R/reg_ld.ipynb
          - Linear Regression (highdim): R/reg_hd.ipynb
          - Regression (machine learning): R/reg_ml.ipynb
          - Classification: R/cls.ipynb
  - About:
      - Authors: about/authors.md
  - "Python repo ↗": https://github.com/jaon11/CGDRO-Py
  - "R repo ↗": https://github.com/jaon11/CGDRO

