site_name: CGDRO Documentation
site_description: Comprehensive documentation for CGDRO Python and R packages.
copyright: Copyright © 2025

theme:
  name: material
  language: en      
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: indigo
      accent: indigo

plugins:
  - search:
      lang: [en, zh]
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
  - mkdocs-jupyter:
      execute: false

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  version:
    provider: mike
  social:                       # 页脚 GitHub 图标
    - icon: fontawesome/brands/github
      link: https://github.com/jaon11/CGDRO-Py
      name: CGDRO Python repo
    - icon: fontawesome/brands/github
      link: https://github.com/jaon11/CGDRO
      name: CGDRO R repo

nav:
  - Home: index.md
  - Python Package:
    - Overview: python/index.md
    - Getting Started: python/getting-started.md
    - API Reference: python/api.md
    - Examples:
      - Demo Notebook: python/examples/demo.ipynb
  - R Package:
    - Overview: r/index.md
    - Getting Started: r/getting-started.md
    - Reference: r/reference.md
    - Tutorials:
      - Tutorial 1: r/articles/tutorial.md
  - Source:
    - Python repo ↗: https://github.com/jaon11/CGDRO-Py
    - R repo ↗: https://github.com/jaon11/CGDRO
  - Changelog: changelog.md
